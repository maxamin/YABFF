[package]
name = "ferox-ml-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared ML engines for the YABFF tools: K-Means/nearest-centroid fingerprinting, variable-order Markov/PPM prediction, Thompson/UCB1 scheduling, BM25 ranking, and SimHash soft-404 detection."
repository = "https://github.com/maxamin/YABFF"

[lib]
name = "ferox_ml_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
url = "2"
