[package]
name = "feroxml"
version = "0.1.0"
edition = "2021"
authors = ["YABFF"]
license = "MIT"
description = "Adaptive, ML-driven fuzzing orchestrator that drives feroxbuster with K-Means fingerprinting, variable-order Markov path prediction, and a Thompson-sampling scheduler."
repository = "https://github.com/maxamin/YABFF"

[[bin]]
name = "feroxml"
path = "src/main.rs"

[lib]
name = "feroxml"
path = "src/lib.rs"

[dependencies]
ferox-ml-core = { path = "../ferox-ml-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
